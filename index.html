<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Event Horizon — uma experiência visual através dos limites do espaço e do tempo."
    />

    <meta name="theme-color" content="#000000" />

    <title>EVENT HORIZON</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="app">

      <!-- CAMADA WEBGL -->
      <canvas id="space"></canvas>

      <!-- VINHETA -->
      <div class="vignette"></div>

      <!-- GRANULAÇÃO -->
      <div class="grain"></div>

      <!-- INTERFACE -->
      <main class="interface">

        <!-- TOPO ESQUERDO -->
        <header class="hero">

          <div class="eyebrow">
            SINGULARITY
            <span>/</span>
            01
          </div>

          <h1>
            EVENT<br />
            HORIZON
          </h1>

          <p class="subtitle">
            Uma experiência visual através dos limites do espaço e
            <br class="desktop-break" />
            do tempo.
          </p>

        </header>

        <!-- BOTÃO -->
        <div class="bottom-left">

          <button id="exploreButton" class="explore-button">
            <span>EXPLORAR</span>
            <span class="arrow">↗</span>
          </button>

          <div class="instructions">
            <span class="mouse-icon">◉</span>
            ARRASTE PARA ORBITAR
            <span class="separator">/</span>
            SCROLL PARA APROXIMAR
          </div>

        </div>

        <!-- RODAPÉ -->
        <footer class="footer">

          <div class="footer-left">
            COSMOS RESEARCH
          </div>

          <div class="footer-right">
            2026
          </div>

        </footer>

      </main>

      <!-- INDICADOR DE CARREGAMENTO -->
      <div id="loader" class="loader">
        <div class="loader-text">
          INITIALIZING
        </div>

        <div class="loader-line">
          <span></span>
        </div>
      </div>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
